<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Activate Shop</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --muted:#94a3b8; --accent:#38bdf8; --err:#f87171; --ok:#4ade80; --border:#334155; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; background: linear-gradient(160deg,#0f172a,#1e3a5f 55%,#0f172a); color:var(--text); min-height:100vh; }
    .wrap { max-width:640px; margin:0 auto; padding:28px 16px 48px; }
    h1 { font-size:1.55rem; margin:0 0 8px; }
    h2 { font-size:1.12rem; margin:0 0 12px; }
    p { color:var(--muted); line-height:1.5; }
    .card { background:var(--card); border:1px solid rgba(148,163,184,.25); border-radius:12px; padding:20px; margin-top:16px; }
    label { display:block; font-size:.85rem; color:var(--muted); margin:12px 0 4px; }
    input, select, textarea { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:#0f172a; color:var(--text); font:inherit; }
    button, .btn { margin-top:12px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#0f172a; font-weight:700; cursor:pointer; font:inherit; text-align:center; text-decoration:none; display:inline-block; }
    .btn.secondary { background:#334155; color:var(--text); }
    .row-btns { display:flex; flex-wrap:wrap; gap:8px; }
    .row-btns .btn { flex:1; min-width:140px; width:auto; }
    .err { color:var(--err); }
    .ok { color:var(--ok); }
    .steps { display:flex; flex-wrap:wrap; gap:6px; margin:16px 0 0; padding:0; list-style:none; font-size:.72rem; }
    .steps li { padding:6px 8px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
    .steps li.on { background:var(--accent); color:#0f172a; border-color:var(--accent); font-weight:700; }
    .steps li.done { border-color:var(--ok); color:var(--ok); }
    .contract-box { max-height:320px; overflow:auto; background:#0b1220; border:1px solid var(--border); border-radius:8px; padding:12px; white-space:pre-wrap; font-size:.9rem; line-height:1.45; color:var(--text); }
    .sig-wrap { margin-top:14px; border:2px dashed var(--border); border-radius:10px; background:#0b1220; position:relative; touch-action:none; }
    .sig-wrap canvas { width:100%; height:160px; display:block; cursor:crosshair; touch-action:none; }
    .sig-hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); pointer-events:none; font-size:.95rem; letter-spacing:.04em; }
    .sig-wrap.dirty .sig-hint { display:none; }
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; }
    @media (max-width:560px) { .info-grid { grid-template-columns:1fr; } .wrap { padding:18px 12px 40px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Activate Shop</h1>
    <p id="subtitle">Complete these steps to unlock your shop.</p>
    <ul class="steps" id="stepper"></ul>
    <div class="card" id="panel"></div>
    <p id="msg" class="err"></p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const state = {
      step: 1,
      shop_id: (params.get('shop') || '').trim(),
      token: (params.get('token') || '').trim(),
      code: '',
      ctx: null,
      device_name: 'This device',
      device_type: 'browser',
      accept_name: '',
      accept_email: '',
      accept_id: '',
      accept_phone: '',
      signatureData: '',
      signed: false,
      acceptanceId: null
    };

    function devicePublicId() {
      let id = localStorage.getItem('shoppos_device_public_id');
      if (!id) {
        id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('shoppos_device_public_id', id);
      }
      return id;
    }

    async function rpc(method, args) {
      const res = await fetch('/rpc', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ method, args })
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || json.success === false) {
        const err = new Error(json.error || 'Request failed');
        err.code = json.code;
        throw err;
      }
      return json.data != null ? json.data : json;
    }

    function setMsg(text, ok) {
      const el = document.getElementById('msg');
      el.className = ok ? 'ok' : 'err';
      el.textContent = text || '';
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function renderStepper() {
      const labels = [
        '1 · Customer Info',
        '2 · Read Contract',
        '3 · Accept & Sign',
        '4 · Activate Device',
        '5 · Owner Account',
        '6 · Shop Setup'
      ];
      document.getElementById('stepper').innerHTML = labels.map((label, i) => {
        const n = i + 1;
        const cls = n === state.step ? 'on' : (n < state.step ? 'done' : '');
        return `<li class="${cls}">${label}</li>`;
      }).join('');
    }

    async function loadContext() {
      if (!state.shop_id) return;
      state.ctx = await rpc('activation:getContext', [{
        shop_id: state.shop_id,
        link_token: state.token || undefined,
        code: state.code || undefined
      }]);
      if (state.ctx.owner_name && !state.accept_name) state.accept_name = state.ctx.owner_name;
      if (state.ctx.owner_email && !state.accept_email) state.accept_email = state.ctx.owner_email;
      if (state.ctx.owner_id_number && !state.accept_id) state.accept_id = state.ctx.owner_id_number;
      if ((state.ctx.contact_phone || state.ctx.whatsapp) && !state.accept_phone) {
        state.accept_phone = state.ctx.contact_phone || state.ctx.whatsapp;
      }
      if (state.ctx.token_error && (state.token || state.code)) setMsg(state.ctx.token_error, false);
    }

    function printContract() {
      const body = state.ctx?.contract?.body_text || '';
      const title = state.ctx?.contract?.title || 'Customer Agreement';
      const w = window.open('', '_blank');
      if (!w) { setMsg('Pop-up blocked — allow pop-ups to print'); return; }
      w.document.write(`<!DOCTYPE html><html><head><title>${esc(title)}</title>
        <style>body{font-family:Georgia,serif;padding:24px;white-space:pre-wrap;line-height:1.45}</style></head>
        <body><h1>${esc(title)}</h1><p>${esc(state.ctx?.contract?.version_label || '')}</p><pre>${esc(body)}</pre></body></html>`);
      w.document.close();
      w.focus();
      w.print();
    }

    function bindSignature(canvas) {
      const wrap = canvas.parentElement;
      const ctx = canvas.getContext('2d');
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * ratio);
      canvas.height = Math.floor(160 * ratio);
      ctx.scale(ratio, ratio);
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#f8fafc';
      let drawing = false;
      let dirty = false;
      const pos = (e) => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      };
      const start = (e) => {
        e.preventDefault();
        drawing = true;
        dirty = true;
        wrap.classList.add('dirty');
        const p = pos(e);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      };
      const move = (e) => {
        if (!drawing) return;
        e.preventDefault();
        const p = pos(e);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      };
      const end = (e) => {
        if (!drawing) return;
        e.preventDefault();
        drawing = false;
        state.signatureData = dirty ? canvas.toDataURL('image/png') : '';
      };
      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end, { passive: false });
      return {
        clear() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          wrap.classList.remove('dirty');
          dirty = false;
          state.signatureData = '';
        },
        isDirty: () => dirty
      };
    }

    function render() {
      renderStepper();
      const panel = document.getElementById('panel');
      const ctx = state.ctx;
      const shopLabel = ctx?.shop_name || state.shop_id || 'your shop';
      document.getElementById('subtitle').textContent = shopLabel !== 'your shop'
        ? `Activating ${shopLabel}`
        : 'Complete these steps to unlock your shop.';

      if (!state.shop_id) {
        panel.innerHTML = `
          <h2>Enter Shop ID</h2>
          <label>Shop ID</label><input id="f-shop" />
          <label>Activation code (optional)</label><input id="f-code" placeholder="XXXXX-XXXXX" />
          <label>Or link token</label><input id="f-token" value="${esc(state.token)}" />
          <button id="btn-start">Continue</button>`;
        document.getElementById('btn-start').onclick = async () => {
          state.shop_id = document.getElementById('f-shop').value.trim();
          state.code = document.getElementById('f-code').value.trim();
          state.token = document.getElementById('f-token').value.trim();
          try {
            setMsg('');
            await loadContext();
            state.step = 1;
            render();
          } catch (e) { setMsg(e.message); }
        };
        return;
      }

      if (state.step === 1) {
        panel.innerHTML = `
          <h2>Step 1 — Customer Information</h2>
          <p>Confirm the customer details for this activation.</p>
          <div class="info-grid">
            <div><label>Full name</label><input id="f-name" value="${esc(state.accept_name)}" /></div>
            <div><label>Email</label><input id="f-email" type="email" value="${esc(state.accept_email)}" /></div>
            <div><label>ID / registration</label><input id="f-id" value="${esc(state.accept_id)}" /></div>
            <div><label>Phone / WhatsApp</label><input id="f-phone" value="${esc(state.accept_phone)}" /></div>
          </div>
          <p class="ok" style="margin-top:12px">Shop: <strong>${esc(shopLabel)}</strong> · ID ${esc(state.shop_id)}</p>
          <button id="btn-next">Continue to Contract</button>`;
        document.getElementById('btn-next').onclick = () => {
          state.accept_name = document.getElementById('f-name').value.trim();
          state.accept_email = document.getElementById('f-email').value.trim();
          state.accept_id = document.getElementById('f-id').value.trim();
          state.accept_phone = document.getElementById('f-phone').value.trim();
          if (!state.accept_name || !state.accept_email) { setMsg('Name and email are required'); return; }
          setMsg('');
          state.step = (ctx?.contract_required === false) ? 4 : 2;
          render();
        };
        return;
      }

      if (state.step === 2) {
        const body = ctx?.contract?.body_text || 'Agreement text is not available yet. Contact your administrator.';
        const title = ctx?.contract?.title || 'Customer Agreement';
        panel.innerHTML = `
          <h2>Step 2 — Read Contract</h2>
          <p><strong>${esc(title)}</strong>${ctx?.contract?.version_label ? ` · ${esc(ctx.contract.version_label)}` : ''}</p>
          <div class="contract-box" id="contract-body">${esc(body)}</div>
          <div class="row-btns">
            <button class="btn secondary" id="btn-print">Download / Print Contract</button>
            <button class="btn" id="btn-read">I have read the contract</button>
          </div>
          <button class="btn secondary" id="btn-back">Back</button>`;
        document.getElementById('btn-print').onclick = () => printContract();
        document.getElementById('btn-read').onclick = () => { state.step = 3; setMsg(''); render(); };
        document.getElementById('btn-back').onclick = () => { state.step = 1; render(); };
        return;
      }

      if (state.step === 3) {
        if (state.signed) {
          panel.innerHTML = `
            <h2>Contract accepted successfully.</h2>
            <p class="ok">Acceptance ID: ${esc(state.acceptanceId || '—')}</p>
            <button id="btn-continue">Continue to Activate</button>`;
          document.getElementById('btn-continue').onclick = () => { state.step = 4; render(); };
          return;
        }
        const body = ctx?.contract?.body_text || '';
        panel.innerHTML = `
          <h2>Step 3 — Accept &amp; Sign Contract</h2>
          <p>Draw your signature below using mouse, trackpad, or touchscreen.</p>
          <div class="contract-box" style="max-height:140px">${esc(body.slice(0, 600))}${body.length > 600 ? '…' : ''}</div>
          <label>Sign here</label>
          <div class="sig-wrap" id="sig-wrap"><div class="sig-hint">SIGN HERE</div><canvas id="sig-canvas"></canvas></div>
          <div class="row-btns">
            <button class="btn secondary" id="btn-clear">Clear Signature</button>
            <button class="btn secondary" id="btn-print2">Download / Print Contract</button>
          </div>
          <button id="btn-sign">Accept &amp; Sign Contract</button>
          <button class="btn secondary" id="btn-back">Back</button>`;
        const pad = bindSignature(document.getElementById('sig-canvas'));
        document.getElementById('btn-clear').onclick = () => pad.clear();
        document.getElementById('btn-print2').onclick = () => printContract();
        document.getElementById('btn-back').onclick = () => { state.step = 2; render(); };
        document.getElementById('btn-sign').onclick = async () => {
          if (!pad.isDirty() || !state.signatureData) { setMsg('Please draw your signature'); return; }
          try {
            const data = await rpc('activation:acceptContract', [state.shop_id, {
              accepted_by_name: state.accept_name,
              accepted_by_email: state.accept_email,
              contract_version_id: ctx?.contract?.id,
              signature_data: state.signatureData,
              device_public_id: devicePublicId(),
              user_agent_hint: navigator.userAgent,
              require_signature: true
            }]);
            state.signed = true;
            state.acceptanceId = data.acceptance_id || data.latest_acceptance?.id || null;
            await loadContext();
            setMsg('Contract accepted successfully.', true);
            render();
          } catch (e) { setMsg(e.message); }
        };
        return;
      }

      if (state.step === 4) {
        if (ctx?.contract_required !== false && !ctx?.contract_accepted) {
          panel.innerHTML = `<h2>Contract required</h2><p class="err">Please accept the agreement before activating this device.</p>
            <button id="btn-to-contract">Review Contract</button>`;
          document.getElementById('btn-to-contract').onclick = () => { state.step = 2; render(); };
          return;
        }
        if (ctx?.token_error) {
          panel.innerHTML = `<h2>Activation unavailable</h2><p class="err">${esc(ctx.token_error)}</p>`;
          return;
        }
        panel.innerHTML = `
          <h2>Step 4 — Activate Device</h2>
          <p>Register this browser or computer for ${esc(shopLabel)}.</p>
          ${!state.token && !state.code ? `<label>Activation code</label><input id="f-code" placeholder="XXXXX-XXXXX" />` : `<p class="ok">Activation credentials ready.</p>`}
          <label>Device name</label><input id="f-dname" value="${esc(state.device_name)}" />
          <label>Device type</label>
          <select id="f-dtype">
            <option value="windows">Windows</option>
            <option value="android">Android</option>
            <option value="browser" selected>Browser</option>
          </select>
          <button id="btn-activate">Activate device</button>`;
        document.getElementById('btn-activate').onclick = async () => {
          const codeEl = document.getElementById('f-code');
          if (codeEl) state.code = codeEl.value.trim();
          state.device_name = document.getElementById('f-dname').value.trim() || 'This device';
          state.device_type = document.getElementById('f-dtype').value;
          try {
            const data = await rpc('activation:redeem', [{
              shop_id: state.shop_id,
              code: state.code || undefined,
              link_token: state.token || undefined,
              device: {
                device_public_id: devicePublicId(),
                device_name: state.device_name,
                device_type: state.device_type,
                app_version: 'web-activate'
              }
            }]);
            localStorage.setItem('shoppos_shop_id', data.shop_id || state.shop_id);
            if (data.license) localStorage.setItem('shoppos_license_lease', JSON.stringify(data.license));
            localStorage.setItem('shoppos_license_sync_at', String(Date.now()));
            setMsg('Device activated for ' + (data.shop_name || state.shop_id), true);
            state.step = 5;
            render();
          } catch (e) {
            if (e.code === 'CONTRACT_REQUIRED') {
              state.step = 2;
              state.signed = false;
              setMsg(e.message);
              render();
              return;
            }
            setMsg(e.message);
          }
        };
        return;
      }

      if (state.step === 5) {
        panel.innerHTML = `
          <h2>Step 5 — Create / Confirm Owner Account</h2>
          <p>Next you will create the shop owner account in the Shop POS setup wizard.</p>
          <a class="btn" id="btn-setup" href="/?start=setup">Continue to Set Up My Shop</a>
          <button class="btn secondary" id="btn-skip">I already finished setup</button>`;
        document.getElementById('btn-skip').onclick = () => { state.step = 6; render(); };
        document.getElementById('btn-setup').onclick = () => { state.step = 6; };
        return;
      }

      panel.innerHTML = `
        <h2>Step 6 — Shop Setup &amp; POS</h2>
        <a class="btn" href="/?start=setup">Open Shop Setup</a>
        <a class="btn secondary" href="/?page=pos">Go to POS</a>
        <a class="btn secondary" href="/">Go to Shop Home</a>`;
    }

    (async () => {
      try {
        if (state.shop_id) {
          await loadContext();
          if (state.ctx?.token_error) state.step = 4;
          else if (state.ctx?.contract_required && (!state.ctx?.contract_accepted || state.ctx?.needs_reacceptance)) state.step = 1;
          else state.step = 4;
        }
      } catch (e) { setMsg(e.message); }
      render();
    })();
  </script>
</body>
</html>
