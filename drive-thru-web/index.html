<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>Drive-Thru Station</title>
  <link rel="stylesheet" href="/drive-thru/css/drive-thru.css">
</head>
<body>
  <div id="login-screen" class="screen hidden"><div class="login-box">
    <h1>Drive-Thru Station</h1>
    <p class="muted" style="margin:0 0 12px;max-width:320px;line-height:1.45">Use your <strong>Admin username &amp; password</strong> (owner, manager, supervisor). Or <code>drivethru</code> / <code>dt123456</code>.</p>
    <input id="dt-user" placeholder="Admin username" autocomplete="username">
    <input id="dt-pass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="dt-login-btn">Sign In</button>
    <button type="button" id="dt-show-pair" style="background:#334155">Show pairing code</button>
    <p id="login-err" class="err"></p></div></div>
  <div id="station-setup" class="screen"><div class="login-box">
    <h2>Pair this station</h2>
    <p class="muted" style="margin:0 0 8px">Pairing code</p>
    <p id="pair-code" style="font-size:36px;letter-spacing:6px;font-weight:800;margin:0 0 8px">------</p>
    <p id="pair-msg" class="muted" style="margin:0 0 16px;max-width:340px;line-height:1.45">Requesting a code… Approve it in Admin → Business Modules → Drive-Thru.</p>
    <p class="muted" style="margin:0 0 8px">Or paste a station token</p>
    <input id="station-token" placeholder="Paste station token here" autocomplete="off">
    <button id="station-connect-btn">Connect with token</button></div></div>
  <div id="app" class="screen hidden"></div>
  <script src="/drive-thru/js/config.js"></script>
  <script src="/drive-thru/js/audio.js"></script>
  <script src="/drive-thru/js/api.js"></script>
  <script src="/drive-thru/js/app.js"></script>
</body>
</html>
