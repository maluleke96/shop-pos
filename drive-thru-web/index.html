<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>Drive-Thru Station</title>
  <link rel="stylesheet" href="css/drive-thru.css">
</head>
<body>
  <div id="login-screen" class="screen"><div class="login-box">
    <h1>Drive-Thru Station</h1>
    <input id="dt-user" placeholder="Username"><input id="dt-pass" type="password" placeholder="Password">
    <button id="dt-login-btn">Sign In</button>
    <p id="login-err" class="err"></p></div></div>
  <div id="station-setup" class="screen hidden"><div class="login-box">
    <h2>Select Station</h2><input id="station-token" placeholder="Station token (from admin)">
    <button id="station-connect-btn">Connect Station</button></div></div>
  <div id="app" class="screen hidden"></div>
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
