<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop POS Admin</title>
  <script>window.__SHOP_POS_APP_MODE__ = 'admin';</script>
</head>
<body>
  <p style="font-family:system-ui;padding:24px;text-align:center">Opening Admin…</p>

    window.__SHOP_POS_APP_MODE__ = 'admin';

      sessionStorage.setItem('SHOP_POS_APP_MODE', 'admin');
      localStorage.setItem('SHOP_POS_APP_MODE', 'admin');
    } catch (e) {}
    location.replace('/index.html#app=admin');
  </script>
</body>
</html>
